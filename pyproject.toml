[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-template"
version = "1.0.0"
description = "Reusable Python application template built with FastAPI"
requires-python = ">=3.13,<3.16"
dependencies = [
    "fastapi>=0.115.14,<0.116.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "python-multipart==0.0.9,<1.0.0",
    "passlib[bcrypt]==1.7.4,<2.0.0",
    "python-jose[cryptography]==3.5.0,<4.0.0",
    "pydantic[email]==2.11.7,<3.0.0",
    "python-dotenv==1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "anyio>=4.0.0,<4.10.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "build>=1.2.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "static/**/*",
    "templates/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle e pyflakes (basic errors)
    "I",        # import ordering
    "B",        # bugbear (common bugs)
    "UP",       # syntax modernization
    "N",        # naming convention
    "PT",       # pytest best practices
    "SIM",      # code simplifications
]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = [
    "B008",     # FastAPI-specific configuration
]
